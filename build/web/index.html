<!-- OneSignal Web SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "382f86fc-7b9e-48d3-a6b3-30a0170bd8d7",
        safari_web_id: "web.onesignal.auto.4eb8ce3a-dc5a-4285-aae8-d5934d20e23e",
        notifyButton: {
          enable: true,
        },
        allowLocalhostAsSecureOrigin: true,
      });
    });

    // Helper functions for Flutter to call
    window.loginOneSignal = function(userId) {
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.login(userId);
      });
    };

    window.promptOneSignal = function() {
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.Slidedown.promptPush();
      });
    };
  </script>
