name: shadow_comm
description: A secure Flutter messaging prototype.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.10.7

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  cryptography_plus: ^3.0.0
  cryptography: ^2.9.0
  supabase_flutter: ^2.12.0
  convert: ^3.1.1
  share_plus: ^12.0.1
  image_picker: ^1.0.0
  flutter_image_compress: ^2.0.0
  cached_network_image: ^3.3.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/ic_launcher.png"
  adaptive_icon_background: "#0a0c10" # Matches the dark vibe of your icon
  adaptive_icon_foreground: "assets/images/ic_launcher.png"